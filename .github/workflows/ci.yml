name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install the MCP SDK
        run: python3 -m pip install --disable-pip-version-check -r mcp/requirements.txt
      - name: Test coordination rules
        run: python3 -m unittest discover -s tests -v

  # Egregore on Cloudflare Workers. Runs real work only when worker/** changed,
  # so Python-only pull requests skip it. It never deploys and holds no secrets:
  # `wrangler deploy --dry-run` builds the bundle locally and calls no API.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect worker changes
        id: changes
        run: |
          set -eu
          changed=true
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- worker/; then
              changed=false
            fi
          fi
          echo "worker=${changed}" >> "$GITHUB_OUTPUT"
          echo "worker/** changed: ${changed}"
      - name: Set up Node
        if: steps.changes.outputs.worker == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install
        if: steps.changes.outputs.worker == 'true'
        working-directory: worker
        run: npm ci
      - name: Type check
        if: steps.changes.outputs.worker == 'true'
        working-directory: worker
        run: npm run typecheck
      - name: Test
        if: steps.changes.outputs.worker == 'true'
        working-directory: worker
        run: npm test
      - name: Wrangler dry run (no deploy)
        if: steps.changes.outputs.worker == 'true'
        working-directory: worker
        run: npm run dry-run
