name: Handoff
description: Pass the next step to another agent. This does not grant access.
title: "[Handoff]: "
labels:
  - "type:handoff"
  - "status:ready"
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. It stores coordination information only. Do not put project data, health data, credentials, or another person's personal information here.

        A handoff changes who does the next step. It does not change GitHub permissions or share project data.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - coordination
        - whoop-lens
        - weather-intelligence
        - other
    validations:
      required: true
  - type: input
    id: project-slug
    attributes:
      label: Project slug
      description: Required when Project is other.
      placeholder: whoop-lens
  - type: dropdown
    id: from-role
    attributes:
      label: From
      options:
        - chatgpt
        - grokbot
        - cursor
        - codex
        - aaron
    validations:
      required: true
  - type: dropdown
    id: to-role
    attributes:
      label: To
      options:
        - chatgpt
        - grokbot
        - cursor
        - codex
        - aaron
    validations:
      required: true
  - type: input
    id: related-issue
    attributes:
      label: Related issue
      description: Issue number or URL this handoff continues.
      placeholder: "#12"
    validations:
      required: true
  - type: input
    id: claim
    attributes:
      label: Claim
      description: One sentence on where things stand right now. Facts only.
      placeholder: The empty state copy is drafted and waiting for a pull request.
    validations:
      required: true
  - type: input
    id: ask
    attributes:
      label: Ask
      description: One sentence on what the receiver should do with this handoff.
      placeholder: Open one pull request in the project repo that uses the drafted copy.
    validations:
      required: true
  - type: dropdown
    id: intent
    attributes:
      label: Intent
      description: "action: the receiver does the next step. feedback: the receiver answers or reviews. fyi: nothing is needed, and the receiver may just read it."
      options:
        - action
        - feedback
        - fyi
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done so far
      description: Facts and links the next agent can verify.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: "Optional. Choices already made that the receiver should not reopen. For each one write the decision, the reason, and what follows from it."
      placeholder: |
        - Decision: ...
          Reason: ...
          Consequence: ...
  - type: textarea
    id: open-threads
    attributes:
      label: Open threads
      description: "Optional. Questions or risks nobody has settled yet. Link the issue or comment where each one lives."
  - type: textarea
    id: next-action
    attributes:
      label: Next action
      description: The single next step.
    validations:
      required: true
  - type: textarea
    id: next-steps
    attributes:
      label: Next steps
      description: "Optional. What comes after the single next action, in order. Leave it empty when there is nothing after that."
  - type: textarea
    id: access
    attributes:
      label: Access
      description: Keep the sentence that this handoff does not grant access. Name the repo where the work happens, and whether Aaron has already granted access there.
      value: |
        This handoff does not grant repository access, data access, credentials, or permission to merge or deploy.
    validations:
      required: true
  - type: checkboxes
    id: data-boundary
    attributes:
      label: Data boundary
      options:
        - label: "Coordination only. No project data, health data, credentials, or another person's personal information."
          required: true
